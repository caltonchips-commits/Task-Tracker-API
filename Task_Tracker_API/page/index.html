<!DOCTYPE html>
<!-- Define the page document. -->
<html lang="en">
<head>
    <!-- Set the page information. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker API</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/script.css') }}">

    <!-- Load the page font. -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Task Tracker API</h1>
            <p class="subtitle">Welcome to the Task Tracker API, it allows you to manage your tasks efficiently.</p>
        </header>

        <!-- Add a task. -->
        <form id="taskForm" class="input-card">
            <input type="text" id="taskTitle" placeholder="Enter a new task" required class="input-field">
            <input type="date" id="taskDueDate" required class="input-field">
            <textarea id="taskDescription" placeholder="Description" class="input-field"></textarea>
            <select id="taskStatus" required class="input-field">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
            <button type="submit" class="submit-button">Add Task</button>
        </form>

        <!-- Show the task list. -->
         <div class="task-list">
            <h2>Tasks</h2>
            <div id="loading" class="loading">Loading Tasks</div>
            <div id="emptyState" class="empty hidden">No tasks available. Add a new task to get started!</div>
            <div id="taskContainer" class="task-container"></div>
         </div>
    </div>

    <!-- Show messages. -->
<div id="toast" class="hidden toast"></div>

    <!-- Load the page script. -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
